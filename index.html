<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Left Calculator Panel -->
    <div class="left-panel">

        <div class="header-section">

<!-- 
         <div class="menu-btn" onclick="toggleMenu()">
            ☰
         </div>  
         <div id="sideMenu" class="side-menu">

    <div class="menu-item">
        🕒 History
    </div>

    <div class="menu-item">
        ⚙ Settings
    </div>

    <div class="menu-item">
        ℹ About
    </div>

    </div> -->
         
<div class="header">
    

         <div class="menu-btn" onclick="toggleMenu()">
            ☰
         </div>  
         <div id="sideMenu" class="side-menu">

    <div class="menu-item">
        🕒 History
    </div>

    <div class="menu-item">
        ⚙ Settings
    </div>

    <div class="menu-item">
        ℹ About
    </div>

    </div>
         
   
    <h2 class="logo">ECHOO</h2>
</div>

           
        <div class="display-section">

    <div class="display-top">

        <div>
       

            <div class="expression" id="expression">
                
            </div>
        </div>

      

    </div>

    <hr>

    <p class="label">Result</p> 

    <div class="result" id="result">
        0
    </div>

</div>
    


     <div class="calculator-section">

    <div class="button-grid">
     <button onclick="appendValue('7')">7</button>
     <button onclick="appendValue('8')">8</button>
     <button onclick="appendValue('9')">9</button>
     <button onclick="appendValue('4')">4</button>
     <button onclick="appendValue('5')">5</button>
     <button onclick="appendValue('6')">6</button>
     <button onclick="appendValue('1')">1</button>
     <button onclick="appendValue('2')">2</button>
     <button onclick="appendValue('3')">3</button>
  
    <button onclick="appendValue('0')">0</button>
    
    <button onclick="appendValue('.')">.</button>
    <button onclick="appendValue('+')">+</button>
    <button onclick="appendValue('-')">-</button>
    <button onclick="appendValue('*')">×</button>
    <button onclick="appendValue('/')">÷</button>

    <button class="equal-btn" onclick="calculateResult()">=</button>
    <button onclick="backspace()">⌫</button>
    <button onclick="clearDisplay()">AC</button> 

   <button onclick="calculateScientific('sin')">sin</button>
   <button onclick="calculateScientific('cos')">cos</button>
   <button onclick="calculateScientific('tan')">tan</button>
   <button onclick="calculateScientific('log')">log</button>

   <button onclick="calculateScientific('ln')">ln</button>
   <button onclick="calculateScientific('sqrt')">√</button>

   <button onclick="insertConstant('pi')">π</button>
   <button onclick="insertConstant('e')">e</button>
   <button onclick="squareValue()">x²</button>



    </div>

</div>


</div>
    <!-- Right Sidebar -->
    <div class="right-panel">

 

   <div class="card" onclick="toggleFormulaList()">
 Formulas
</div>

<div id="formulaList" style="display:none; margin-top:10px;">
   <div class="card" onclick="circleArea()">
Circle Area
</div>
    <div class="card">Simple Interest</div>
    <div class="card">BMI</div>
    <div class="card">Percentage</div>
    <div class="card">Mean</div>
    <div class="card">Median</div>
    <div class="card">Mode</div>
    <div class="card">Variance</div>
    <div class="card">Standard Deviation</div>
</div>

    <div class="card" onclick="toggleCurrencyList()">
    Currency Converter
</div>

<div id="currencyList" style="display:none; margin-top:10px;">
    <div class="card">INR → USD</div>
    <div class="card">USD → INR</div>
    <div class="card">INR → EUR</div>
    <div class="card">EUR → INR</div>
    <div class="card">INR → GBP</div>
</div>

   <div class="card" onclick="toggleBinaryList()">
     Binary Converter
</div>

<div id="binaryList" style="display:none; margin-top:10px;">
    <div class="card">Decimal → Binary</div>
    <div class="card">Binary → Decimal</div>
</div>

  

</div>

</div>

<script src="script.js"></script>
</body>
</html>
