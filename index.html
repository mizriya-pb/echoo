<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Voice Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Left Calculator Panel -->
    <div class="left-panel">

        <div class="header-section">

            <div class="menu-btn">
        ☰
    </div>
            <div class="header-title">
         <!-- <div class="logo"></div> -->

        <div>
            <h2>Scientific Voice Calculator</h2>
            <p>Smart Voice-Powered Calculator</p>
        </div>

    </div>

    <div class="voice-icon">
        🎤
    </div>
        </div>

        <div class="display-section">

    <div class="display-top">

        <div>
            <p class="label">Expression</p>

            <div class="expression" id="expression">
                
            </div>
        </div>

        <div class="copy-btn">
            📋
        </div>

    </div>

    <hr>

    <p class="label">Result</p>

    <div class="result" id="result">
        0
    </div>

</div>

        <div class="tab-section">

    <button class="tab-btn">
        Basic
    </button>

    <button class="tab-btn active-tab">
        Scientific
    </button>

    <button class="tab-btn">
        Formula
    </button>

    <button class="tab-btn">
        Convert
    </button>

</div>

     <div class="calculator-section">

    <div class="button-grid">
     <button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>

<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>

<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>

<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>

<button onclick="appendValue('+')">+</button>

<button onclick="appendValue('-')">-</button>

<button onclick="appendValue('*')">×</button>

<button onclick="appendValue('/')">÷</button>

<button class="equal-btn" onclick="calculateResult()">=</button>
<button onclick="clearDisplay()">AC</button>
       
    <button onclick="calculateScientific('sin')">sin</button>
<button onclick="calculateScientific('cos')">cos</button>
<button onclick="calculateScientific('tan')">tan</button>
<button onclick="calculateScientific('log')">log</button>

<button onclick="calculateScientific('ln')">ln</button>
<button onclick="calculateScientific('sqrt')">√</button>

<button onclick="insertConstant('pi')">π</button>
<button onclick="insertConstant('e')">e</button>

<button onclick="squareValue()">x²</button>



    </div>

</div>
   

<div class="voice-section">

    <div class="voice-circle">
        🎤
    </div>

    <h3>Tap and Speak</h3>

    <p>Voice Recognition Ready</p>

</div>

</div>
    <!-- Right Sidebar -->
    <div class="right-panel">

       
 <div class="banner">

    <h2>Voice Calculator</h2>

    <p>
        Perform scientific calculations
        using voice commands.
    </p>

    <div class="banner-mic">
        🎤
    </div>

</div>

<div class="card">
    📘 Formulas
</div>

<div class="card">
    💱 Currency Converter
</div>

<div class="card">
    01 Binary Converter
</div>

<div class="card">
    % Percentage Tools
</div>

<div class="card">
    🕒 History
</div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
