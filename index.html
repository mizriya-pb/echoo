<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Left Calculator Panel -->
    <div class="left-panel">

        <div class="header-section">

         
<div class="header">
    

         <div class="menu-btn" onclick="toggleMenu()">
            ☰
         </div>  
         <div id="sideMenu" class="side-menu">

    <div class="menu-item">
        🕒 History
    </div>

    <div class="menu-item">
        ⚙ Settings
    </div>

    <div class="menu-item">
        ℹ About
    </div>

    </div>
         
   <div class="title-box">
    <h2 class="logo">ECHOO</h2>
   
</div>
</div>
   
           
        <div class="display-section">

    <div class="display-top">

        <div>
       

            <div class="expression" id="expression">
                
            </div>
        </div>

      

    </div>

    <hr>

    <p class="label">Result</p> 

    <div class="result" id="result">
        0
    </div>

</div>
    


     <div class="calculator-section">

    <div class="button-grid">
    <!-- Row 1 -->
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="backspace()">⌫</button>

<!-- Row 2 -->
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="ac-btn" onclick="clearDisplay()">AC</button>

<!-- Row 3 -->
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('+')">+</button>

<!-- Row 4 -->
<button onclick="appendValue('.')">.</button>
<button onclick="appendValue('0')">0</button>
<button class="equal-btn" onclick="calculateResult()">=</button>
<button onclick="appendValue('-')">-</button>


<!-- Row 5 -->
<button onclick="calculateScientific('sin')">sin</button>
<button onclick="calculateScientific('cos')">cos</button>
<button onclick="calculateScientific('tan')">tan</button>
<button onclick="appendValue('*')">×</button>


<!-- Row 6 -->
<button onclick="calculateScientific('log')">log</button>
<button onclick="calculateScientific('ln')">ln</button>
<button onclick="calculateScientific('sqrt')">√</button>
<button onclick="appendValue('/')">÷</button>

<!-- Row 7 -->
<button onclick="insertConstant('pi')">π</button>
<button onclick="insertConstant('e')">e</button>
<button onclick="squareValue()">x²</button>
<button disabled></button>


    </div>

</div>
</div>

</div>
    <!-- Right Sidebar -->
   <div class="right-panel">

    <label>Formulas</label>
    <select id="formulaSelect">
        <option selected disabled>Select Formula</option>

        <option>Area</option>
        <option>Volume</option>
        <option>Perimeter</option>
        <option>Speed</option>
        <option>Simple Interest</option>
        <option>BMI</option>
        <option>Percentage</option>
        <option>Mean</option>
        <option>Median</option>
        <option>Mode</option>
        <option>Variance</option>
        <option>Standard Deviation</option>
        <option>Z-Score</option>
        <option>Covariance</option>
    </select>
    <div id="shapeContainer" style="display:none;">

    <label>Select Shape</label>

    <select id="shapeSelect">

        <option selected disabled>Select Shape</option>

        <option>Circle</option>
        <option>Rectangle</option>
        <option>Square</option>
        <option>Triangle</option>
        <option>Parallelogram</option>

    </select>
    <div id="formulaInputs" style="display:none; margin-top:10px;">

    <input type="text" id="value1" placeholder="Enter Value">

    <input type="text" id="value2" placeholder="Second Value" style="display:none;">
     <input type="number" id="value3" placeholder="Third Value" style="display:none;">
    <button onclick="calculateFormula()">
        Calculate
    </button>

</div>

</div>

    <label>Currency Converter</label>
    <select id="currencySelect">
        <option selected disabled>Select Conversion</option>

        <option>INR → USD</option>
        <option>USD → INR</option>
        <option>INR → EUR</option>
        <option>EUR → INR</option>
        <option>INR → GBP</option>
        <option>GBP → INR</option>
    </select>
    <div id="currencyInputs" style="display:none; margin-top:10px;">

    <input type="number"
           id="currencyAmount"
           placeholder="Enter Amount">

    <button onclick="convertCurrency()">
        Convert
    </button>

</div>
    


    <label>Binary Converter</label>
    <select id="binarySelect">
        <option selected disabled>Select Conversion</option>

        <option>Decimal → Binary</option>
        <option>Binary → Decimal</option>
        <option>Decimal → Octal</option>
        <option>Octal → Decimal</option>
        <option>Decimal → Hexadecimal</option>
        <option>Hexadecimal → Decimal</option>
    </select>
    <div id="binaryInputs" style="display:none; margin-top:10px;">

    <input type="text"
           id="binaryValue"
           placeholder="Enter Value">

     <button onclick="convertBinary()">
        Convert
    </button> 

</div>
   </div>   
</div>

</div>
  

</div>



<script src="script.js"></script>
</body>
</html>
